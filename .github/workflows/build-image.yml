name: Build and Push to GHCR

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch: # 允许手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  # 一个作业做三件事：构建 → 在镜像里跑测试 → 推送**同一份**镜像。
  #
  # ⚠️ 为什么不是一个 verify 作业构建、另一个作业再构建推送：那样「测试通过的
  #    镜像」与「推出去的镜像」是两次独立构建，只有输入相同这一层间接保证。
  #    这里用 `load: true` 落成本地镜像 → 测它 → 打标签推它，推上去的镜像 ID
  #    与被测的完全相同。
  #
  # ⚠️ 本仓库有两条用例只有这里跑得到：`/admin` 宿主桩（web/admin.jsx）与
  #    构建期补丁（scripts/patch-upstream.mjs）都是 fork 独有，上游测试覆盖不到。
  #    测试不过 ⇒ 后面的 docker push 根本不会执行，永远发不出坏镜像。
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Resolve image tags
        id: tags
        # IMAGE_NAME 由上面的步骤写进 $GITHUB_ENV，这里直接当环境变量用；
        # GITHUB_REF_TYPE / GITHUB_REF_NAME / GITHUB_SHA 是 Actions 默认环境变量。
        run: |
          set -euo pipefail
          tags=()
          # 标签推送（例如 v1.2.3）→ 发布不可变版本号镜像，部署端可钉版本。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=("${IMAGE_NAME}:${GITHUB_REF_NAME#v}")
          # 分支推送 / 手动触发 → floating 的 latest + 可回溯到提交的标签。
          else
            tags+=("${IMAGE_NAME}:latest" "${IMAGE_NAME}:${GITHUB_SHA}")
          fi
          {
            echo "tags<<TAGS_EOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tags for ${GITHUB_REF} (${GITHUB_REF_TYPE}):"
          printf '%s\n' "${tags[@]}"

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: codearts2api:verify

      - name: Run test suite inside the built image
        run: docker run --rm --entrypoint sh codearts2api:verify -c 'cd /app && npm test'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 推的就是上面那个被测过的镜像 ID：这里只打标签，不重新构建。
      - name: Tag and push the tested image
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag codearts2api:verify "$tag"
            docker push "$tag"
          done <<< "$TAGS"
