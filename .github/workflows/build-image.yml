name: Build and Push to GHCR

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch: # 允许手动触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}

jobs:
  # 质检闸门：先用同一份 Dockerfile 构建镜像（不推送），在镜像里跑测试。
  # 测试不过 ⇒ build-and-push 不会启动，永远发不出坏镜像。
  # ⚠️ 本仓库自己的两条用例只能在这里跑到：admin 宿主桩（web/admin.jsx）
  #    与构建期补丁（scripts/patch-upstream.mjs）都是 fork 独有，上游测试覆盖不到。
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image for verification
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: codearts2api:verify

      - name: Run test suite inside the built image
        run: docker run --rm --entrypoint sh codearts2api:verify -c 'cd /app && npm test'

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Resolve image tags
        id: tags
        # IMAGE_NAME 由上面的步骤写进 $GITHUB_ENV，这里直接当环境变量用；
        # GITHUB_REF_TYPE / GITHUB_REF_NAME / GITHUB_SHA 是 Actions 默认环境变量。
        run: |
          set -euo pipefail
          tags=()
          # 标签推送（例如 v1.2.3）→ 发布不可变版本号镜像，部署端可钉版本。
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags+=("${IMAGE_NAME}:${GITHUB_REF_NAME#v}")
          # 分支推送 / 手动触发 → floating 的 latest + 可回溯到提交的标签。
          else
            tags+=("${IMAGE_NAME}:latest" "${IMAGE_NAME}:${GITHUB_SHA}")
          fi
          {
            echo "tags<<TAGS_EOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tags for ${GITHUB_REF} (${GITHUB_REF_TYPE}):"
          printf '%s\n' "${tags[@]}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
